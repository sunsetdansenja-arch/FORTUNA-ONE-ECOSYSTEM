<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Fortuna — Status Laundry</title>

<style>
:root{
  --bg:#f3f5f8;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --line:#e5e7eb;
  --dark:#111827;
  --green:#16834a;
  --green-soft:#dcfce7;
  --orange:#c66a00;
  --orange-soft:#fff1d6;
  --red:#d92d20;
  --red-soft:#fee2e2;
  --blue:#2563eb;
  --blue-soft:#dbeafe;
  --shadow:0 14px 40px rgba(15,23,42,.08);
  --radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 0 0,rgba(37,99,235,.07),transparent 28%),
    radial-gradient(circle at 100% 0,rgba(22,131,74,.06),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button{font:inherit;cursor:pointer}
.container{width:min(920px,100%);margin:auto;padding:20px 16px 45px}

/* Header */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:10px 0 24px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#111827,#374151);
  color:#fff;font-weight:900;font-size:20px;
  box-shadow:0 8px 20px rgba(17,24,39,.18);
}
.brand-name{font-weight:850;font-size:18px;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.refresh{
  border:1px solid var(--line);
  background:#fff;color:var(--text);
  padding:9px 12px;border-radius:10px;font-weight:750;
}

/* Loading / error */
.center{
  min-height:65vh;
  display:flex;align-items:center;justify-content:center;
}
.loader{text-align:center;color:var(--muted)}
.spinner{
  width:38px;height:38px;margin:0 auto 13px;
  border:4px solid #e5e7eb;border-top-color:#111827;
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-card{
  width:min(500px,100%);
  background:#fff;border:1px solid var(--line);
  border-radius:22px;padding:28px;text-align:center;
  box-shadow:var(--shadow);
}
.error-icon{
  width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;margin:0 auto 14px;
  background:var(--red-soft);color:var(--red);font-size:24px;
}
.error-card h2{margin:0 0 8px;font-size:21px}
.error-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.error-card button{margin-top:18px}

/* Hero */
.hero{
  background:linear-gradient(135deg,#111827,#263449);
  color:#fff;border-radius:24px;
  padding:25px;
  box-shadow:0 18px 45px rgba(17,24,39,.18);
  position:relative;overflow:hidden;
}
.hero:after{
  content:"";position:absolute;width:180px;height:180px;
  border-radius:50%;right:-75px;top:-80px;
  border:35px solid rgba(255,255,255,.05);
}
.hero-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;position:relative;z-index:1;
}
.eyebrow{
  font-size:10px;text-transform:uppercase;letter-spacing:1px;
  font-weight:800;color:#cbd5e1;
}
.hero h1{margin:6px 0 4px;font-size:28px;letter-spacing:-.7px}
.order-id{font-size:12px;color:#cbd5e1}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 11px;border-radius:999px;
  font-size:11px;font-weight:850;
  background:rgba(255,255,255,.12);color:#fff;
  white-space:nowrap;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:#86efac}
.hero-bottom{
  display:flex;justify-content:space-between;align-items:end;
  gap:20px;margin-top:25px;position:relative;z-index:1;
}
.total-label{font-size:11px;color:#cbd5e1}
.total{font-size:28px;font-weight:900;margin-top:3px}
.payment{
  font-size:11px;font-weight:800;padding:7px 10px;border-radius:9px;
}
.payment.paid{background:#dcfce7;color:#166534}
.payment.unpaid{background:#fee2e2;color:#991b1b}

/* Progress */
.section{margin-top:18px}
.card{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-head{
  padding:18px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.card-head h2{margin:0;font-size:15px}
.card-body{padding:20px}
.progress{
  display:flex;align-items:flex-start;position:relative;
  justify-content:space-between;
}
.progress-line{
  position:absolute;top:17px;left:8%;right:8%;height:3px;
  background:#e5e7eb;border-radius:10px;z-index:0;
}
.progress-fill{
  height:100%;width:0;background:#16834a;border-radius:10px;
  transition:width .4s ease;
}
.step{
  width:20%;position:relative;z-index:1;text-align:center;
}
.step-icon{
  width:36px;height:36px;border-radius:50%;
  margin:0 auto 9px;background:#fff;border:3px solid #e5e7eb;
  display:grid;place-items:center;font-size:14px;
  color:#98a2b3;font-weight:900;
}
.step.active .step-icon{
  border-color:#16834a;background:#16834a;color:#fff;
}
.step.current .step-icon{
  box-shadow:0 0 0 5px rgba(22,131,74,.12);
}
.step.done .step-icon{background:#16834a;color:#fff;border-color:#16834a}
.step-label{font-size:10px;font-weight:750;color:#98a2b3}
.step.active .step-label{color:#344054}
.current-note{
  margin-top:18px;padding:12px 14px;
  background:#f7faf8;border:1px solid #d9eee1;
  border-radius:12px;font-size:12px;color:#344054;
}

/* Info grid */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.info-list{display:grid;gap:0}
.info-row{
  display:flex;justify-content:space-between;gap:15px;
  padding:12px 0;border-bottom:1px solid #f0f2f5;
  font-size:13px;
}
.info-row:last-child{border-bottom:0}
.info-label{color:var(--muted)}
.info-value{text-align:right;font-weight:750}
.items{display:grid;gap:10px}
.item{
  border:1px solid var(--line);border-radius:13px;
  padding:13px;background:#fbfcfe;
}
.item-top{display:flex;justify-content:space-between;gap:10px}
.item-name{font-size:13px;font-weight:800}
.item-price{font-size:13px;font-weight:850}
.item-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.tag{
  padding:4px 7px;border-radius:7px;background:#f2f4f7;
  color:#475467;font-size:10px;font-weight:700;
}
.tag.green{background:var(--green-soft);color:#166534}
.tag.orange{background:var(--orange-soft);color:#92400e}

/* Bottom */
.actions{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:18px;
}
.action-btn{
  border:1px solid var(--line);background:#fff;
  padding:13px;border-radius:12px;
  font-weight:800;color:var(--text);
  text-decoration:none;text-align:center;
  display:block;
}
.action-btn.primary{
  color:#fff;background:#111827;border-color:#111827;
}
.last-update{
  text-align:center;color:var(--muted);font-size:10px;
  margin-top:15px;
}
.footer{text-align:center;color:#98a2b3;font-size:10px;margin-top:25px}

/* Responsive */
@media(max-width:700px){
  .container{padding:14px 12px 35px}
  .hero{padding:21px;border-radius:20px}
  .hero h1{font-size:24px}
  .hero-top{flex-direction:column;gap:12px}
  .hero-bottom{align-items:flex-start;flex-direction:column;gap:12px}
  .info-grid{grid-template-columns:1fr}
  .progress-line{left:9%;right:9%}
  .step-label{font-size:9px}
}
@media(max-width:430px){
  .header{padding-bottom:17px}
  .brand-name{font-size:16px}
  .refresh{font-size:11px;padding:8px 9px}
  .total{font-size:24px}
  .step-icon{width:32px;height:32px;font-size:12px}
  .step-label{font-size:8px}
  .card-body{padding:16px}
  .actions{grid-template-columns:1fr}
}

/* Print */
@media print{
  body{background:#fff}
  .container{width:100%;padding:0}
  .header,.actions,.last-update,.footer,.refresh{display:none!important}
  .hero,.card{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <div class="brand">
      <div class="logo">F</div>
      <div>
        <div class="brand-name">FORTUNA</div>
        <div class="brand-sub">Laundry &amp; Care</div>
      </div>
    </div>
    <button class="refresh" id="btnRefresh">↻ Refresh</button>
  </header>

  <main id="app">
    <div class="center">
      <div class="loader">
        <div class="spinner"></div>
        <div>Memuat status laundry...</div>
      </div>
    </div>
  </main>

  <div class="footer">Terima kasih telah mempercayakan laundry Anda kepada Fortuna.</div>
</div>

<script>
/* =========================================================
   FORTUNA CUSTOMER PAGE
   Single file: HTML + CSS + JS
   ========================================================= */

const WEBHOOK_URL =
  "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/fortuna-v5";

const params = new URLSearchParams(window.location.search);
const ORDER_CODE = (params.get("code") || params.get("order") || "").trim();

const $ = id => document.getElementById(id);

function num(v){
  if(typeof v === "number") return Number.isFinite(v) ? v : 0;
  const n = Number(String(v ?? "").replace(/[^0-9.-]/g,""));
  return Number.isFinite(n) ? n : 0;
}

function rupiah(v){
  return new Intl.NumberFormat("id-ID",{
    style:"currency",
    currency:"IDR",
    maximumFractionDigits:0
  }).format(num(v));
}

function dateOnly(v){
  if(!v) return "";
  const m = String(v).match(/^(\d{4}-\d{2}-\d{2})/);
  if(m) return m[1];
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "" : d.toISOString().slice(0,10);
}

function formatDate(v){
  const d = dateOnly(v);
  if(!d) return "-";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}

function formatDateTime(v){
  if(!v) return "-";
  const d = new Date(v);
  if(Number.isNaN(d.getTime())) return formatDate(v);
  return d.toLocaleString("id-ID",{
    day:"2-digit",month:"short",year:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function normalize(v){
  return String(v ?? "").trim().toUpperCase();
}

async function api(action,data={}){
  const response = await fetch(WEBHOOK_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,data})
  });

  const raw = await response.text();

  let json;
  try{
    json = JSON.parse(raw);
  }catch(e){
    throw new Error("Response backend bukan JSON.");
  }

  if(!response.ok){
    throw new Error(json.message || json.error || `HTTP ${response.status}`);
  }

  if(json.status && json.status !== "success"){
    throw new Error(json.message || "Backend gagal memproses request.");
  }

  return json;
}

/*
  Backend customer_status bisa memiliki bentuk response berbeda
  tergantung versi workflow. Fungsi ini mengambil order dari
  beberapa bentuk struktur umum tanpa mengubah backend.
*/
function extractOrder(response){
  const data = response?.data ?? response;

  if(data?.order && typeof data.order === "object"){
    return data.order;
  }

  if(data?.orders && Array.isArray(data.orders)){
    return data.orders[0] || null;
  }

  if(Array.isArray(data)){
    return data[0] || null;
  }

  if(data?.ORDER_ID || data?.order_id){
    return data;
  }

  return null;
}

function extractItems(order){
  if(Array.isArray(order?.items)) return order.items;
  if(Array.isArray(order?.ITEMS)) return order.ITEMS;
  if(Array.isArray(order?.items_detail)) return order.items_detail;
  return [];
}

/* Status proses.
   Fungsi ini dibuat fleksibel terhadap nama status yang mungkin
   dikirim oleh backend. */
function processStage(order){
  const raw = normalize(
    order?.STATUS_PROSES ||
    order?.STATUS_LAUNDRY ||
    order?.STATUS ||
    ""
  );

  const map = {
    "DITERIMA":0,
    "ORDER DITERIMA":0,
    "BARU":0,
    "MASUK":0,

    "DICUCI":1,
    "CUCI":1,
    "WASHING":1,
    "WASH":1,

    "DIKERINGKAN":2,
    "PENGERINGAN":2,
    "KERING":2,
    "DRYING":2,

    "DISETRIKA":3,
    "SETRIKA":3,
    "IRONING":3,
    "IRON":3,

    "SIAP DIAMBIL":4,
    "READY":4,
    "READY DIAMBIL":4,
    "SELESAI":4,
    "DONE":4
  };

  if(Object.prototype.hasOwnProperty.call(map,raw)){
    return map[raw];
  }

  /* Jika backend memakai STATUS yang bukan status proses,
     coba baca field lain. */
  const candidates = [
    order?.STATUS_ITEM,
    order?.STATUS_LAUNDRY,
    order?.PROGRESS,
    order?.TAHAP
  ];

  for(const candidate of candidates){
    const value = normalize(candidate);
    if(Object.prototype.hasOwnProperty.call(map,value)){
      return map[value];
    }
  }

  return 0;
}

const stages = [
  {label:"Diterima",icon:"✓"},
  {label:"Dicuci",icon:"●"},
  {label:"Dikeringkan",icon:"●"},
  {label:"Disetrika",icon:"●"},
  {label:"Siap Diambil",icon:"✓"}
];

function paymentStatus(order){
  return normalize(order?.STATUS_PEMBAYARAN);
}

function paymentMethod(order){
  return normalize(order?.METODE_TRANSAKSI || "");
}

function getWhatsApp(order){
  const direct = order?.LINK_WA;
  if(direct) return direct;

  const phone = String(order?.NO_WA || "").replace(/\D/g,"");
  if(!phone) return "";

  let normalized = phone;
  if(normalized.startsWith("0")) normalized = "62" + normalized.slice(1);

  const message =
    `Halo Fortuna, saya ingin menanyakan order ${order?.ORDER_ID || ORDER_CODE}.`;

  return `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`;
}

function renderError(message){
  $("app").innerHTML = `
    <div class="center">
      <div class="error-card">
        <div class="error-icon">!</div>
        <h2>Order tidak ditemukan</h2>
        <p>${esc(message)}</p>
        <button class="refresh" onclick="loadOrder()">Coba Lagi</button>
      </div>
    </div>
  `;
}

function renderProgress(order){
  const current = processStage(order);
  const percent = current >= 4 ? 100 : (current / 4) * 100;

  const html = stages.map((stage,index)=>{
    const active = index <= current ? "active" : "";
    const currentClass = index === current ? "current" : "";
    const done = index < current ? "done" : "";

    return `
      <div class="step ${active} ${currentClass} ${done}">
        <div class="step-icon">${index < current ? "✓" : stage.icon}</div>
        <div class="step-label">${stage.label}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="progress">
      <div class="progress-line">
        <div class="progress-fill" style="width:${percent}%"></div>
      </div>
      ${html}
    </div>
  `;
}

function renderItems(items){
  if(!items.length){
    return `<div style="font-size:13px;color:var(--muted)">Detail item belum tersedia.</div>`;
  }

  return `
    <div class="items">
      ${items.map((item,index)=>{
        const name =
          item?.NAMA_ITEM ||
          item?.ITEM ||
          item?.NAMA ||
          item?.PAKET ||
          `Item ${index+1}`;

        const qty = item?.QTY ?? item?.JUMLAH;
        const weight = item?.BERAT ?? item?.WEIGHT;
        const status = item?.STATUS || item?.STATUS_ITEM || "";
        const bill = item?.TAGIHAN ?? item?.TOTAL ?? item?.NOMINAL;

        return `
          <div class="item">
            <div class="item-top">
              <div class="item-name">${esc(name)}</div>
              ${bill !== undefined && bill !== null && bill !== ""
                ? `<div class="item-price">${rupiah(bill)}</div>`
                : ""}
            </div>
            <div class="item-meta">
              ${qty ? `<span class="tag">${esc(qty)} pcs</span>` : ""}
              ${weight ? `<span class="tag">${esc(weight)} kg</span>` : ""}
              ${status ? `<span class="tag green">${esc(status)}</span>` : ""}
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function render(order){
  const items = extractItems(order);
  const paid = paymentStatus(order) === "LUNAS";
  const total =
    order?.TOTAL_TAGIHAN ??
    order?.TOTAL ??
    order?.TAGIHAN ??
    0;

  const packageName =
    order?.PAKET ||
    order?.PACKAGE ||
    (items.length ? "Laundry" : "-");

  const weight =
    order?.TOTAL_BERAT ??
    order?.BERAT ??
    "-";

  const start =
    order?.START ||
    order?.TANGGAL ||
    order?.CREATED_AT;

  const deadline =
    order?.DEADLINE ||
    order?.ESTIMASI_SELESAI ||
    order?.READY_AT ||
    "";

  const method = paymentMethod(order);
  const wa = getWhatsApp(order);

  const currentStage = processStage(order);
  const currentLabel = stages[currentStage]?.label || "Diterima";

  $("app").innerHTML = `
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">Status Laundry</div>
          <h1>${esc(order?.NAMA || "Pelanggan")}</h1>
          <div class="order-id">Order #${esc(order?.ORDER_ID || ORDER_CODE)}</div>
        </div>
        <div class="status-pill">
          <span class="status-dot"></span>
          ${esc(currentLabel)}
        </div>
      </div>

      <div class="hero-bottom">
        <div>
          <div class="total-label">Total Tagihan</div>
          <div class="total">${rupiah(total)}</div>
        </div>
        <div>
          <span class="payment ${paid ? "paid" : "unpaid"}">
            ${paid ? "✓ LUNAS" : "BELUM LUNAS"}
          </span>
        </div>
      </div>
    </section>

    <section class="section card">
      <div class="card-head">
        <h2>Progress Laundry</h2>
        <span style="font-size:11px;color:var(--muted)">Order #${esc(order?.ORDER_ID || ORDER_CODE)}</span>
      </div>
      <div class="card-body">
        ${renderProgress(order)}
        <div class="current-note">
          <strong>Status saat ini:</strong> ${esc(currentLabel)}.
          ${currentStage >= 4
            ? " Pesanan Anda sudah siap untuk diambil."
            : " Pesanan Anda sedang diproses oleh tim Fortuna."}
        </div>
      </div>
    </section>

    <section class="section info-grid">
      <div class="card">
        <div class="card-head"><h2>Detail Pesanan</h2></div>
        <div class="card-body">
          <div class="info-list">
            <div class="info-row">
              <span class="info-label">Nama</span>
              <span class="info-value">${esc(order?.NAMA || "-")}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Paket</span>
              <span class="info-value">${esc(packageName)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Berat</span>
              <span class="info-value">${esc(weight)}${weight !== "-" ? " kg" : ""}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Tanggal Masuk</span>
              <span class="info-value">${formatDate(start)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Estimasi Selesai</span>
              <span class="info-value">${deadline ? formatDateTime(deadline) : "-"}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Pembayaran</h2></div>
        <div class="card-body">
          <div class="info-list">
            <div class="info-row">
              <span class="info-label">Total</span>
              <span class="info-value">${rupiah(total)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Status</span>
              <span class="info-value" style="color:${paid ? "var(--green)" : "var(--red)"}">
                ${paid ? "LUNAS" : "BELUM LUNAS"}
              </span>
            </div>
            <div class="info-row">
              <span class="info-label">Metode</span>
              <span class="info-value">${esc(method || "-")}</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section card">
      <div class="card-head">
        <h2>Detail Item</h2>
        <span class="tag">${items.length} item</span>
      </div>
      <div class="card-body">
        ${renderItems(items)}
      </div>
    </section>

    <div class="actions">
      ${wa
        ? `<a class="action-btn primary" href="${esc(wa)}" target="_blank" rel="noopener">Chat WhatsApp Fortuna</a>`
        : `<button class="action-btn primary" onclick="loadOrder()">↻ Perbarui Status</button>`
      }
      <button class="action-btn" onclick="window.print()">Cetak Ringkasan</button>
    </div>

    <div class="last-update">
      Terakhir diperbarui ${new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
      · Tekan Refresh untuk mengecek status terbaru.
    </div>
  `;
}

async function loadOrder(){
  if(!ORDER_CODE){
    renderError("Link order tidak memiliki kode. Pastikan customer membuka link yang diberikan Fortuna.");
    return;
  }

  $("app").innerHTML = `
    <div class="center">
      <div class="loader">
        <div class="spinner"></div>
        <div>Memuat status order #${esc(ORDER_CODE)}...</div>
      </div>
    </div>
  `;

  try{
    /*
      Customer page menggunakan action customer_status.
      Payload utama dikirim sebagai ORDER_ID.
    */
    const response = await api("customer_status",{
      ORDER_ID: ORDER_CODE
    });

    const order = extractOrder(response);

    if(!order){
      throw new Error("Data order tidak ditemukan.");
    }

    render(order);
  }catch(error){
    console.error(error);
    renderError(error.message || "Gagal mengambil data order.");
  }
}

$("btnRefresh").addEventListener("click",loadOrder);

loadOrder();

/* Auto refresh setiap 60 detik */
setInterval(()=>{
  if(document.visibilityState === "visible"){
    loadOrder();
  }
},60000);
</script>
</body>
</html>
